version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: claude-sessions-db
    environment:
      POSTGRES_USER: claude
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sessions}
      POSTGRES_DB: claude_sessions
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claude -d claude_sessions"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Daily pg_dump backups with rotation.
  # Keeps the last two nights under ./backups (KEEP_DAYS 1 = today and
  # yesterday; the weekly and monthly copies are hard links inside that window).
  # Each dump is a full copy of a growing archive, so local history is kept off
  # this disk: storage.home pulls the newest dump nightly and keeps a week of
  # them (see BACKUP_RESTORE.md).
  # Times are UTC. BACKUP_OPTIONS uses --clean to emit DROP statements for
  # safer restores.
  pgbackup:
    image: prodrigestivill/postgres-backup-local:18-alpine
    container_name: claude-sessions-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: claude_sessions
      POSTGRES_USER: claude
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sessions}
      POSTGRES_EXTRA_OPTS: "--clean --if-exists --compress=gzip:5"
      # 02:15 UTC, clear of the 00:00 UTC burst of backup pings to Healthchecks on the same
      # host: the dump saturates the disk for about five minutes.
      SCHEDULE: "15 2 * * *"
      BACKUP_KEEP_DAYS: "1"
      BACKUP_KEEP_WEEKS: "0"
      BACKUP_KEEP_MONTHS: "0"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - ./backups:/backups

volumes:
  postgres_data:
